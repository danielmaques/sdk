name: pushify_purchases
description: Pushify in-app purchases, subscriptions, and acquisition links for Flutter.
version: 0.1.0
homepage: https://pushify.app
repository: https://github.com/danielmaques/sdk/tree/main/flutter
issue_tracker: https://github.com/danielmaques/sdk/issues
documentation: https://pushify.app/docs/sdks/flutter
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: app.pushify.flutter
        pluginClass: PushifyPurchasesPlugin
      ios:
        pluginClass: PushifyPurchasesPlugin
